[pytest]
# Pytest configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Timeout for tests (seconds)
timeout = 60

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (may use fixtures, network)
    slow: Slow tests (>5 seconds)
    checkpoint: Tests that verify checkpoint functionality
    recovery: Tests that verify recovery/resume functionality
